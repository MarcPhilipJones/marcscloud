ClimateScreen As screen:
    Fill: =McLarenBlack

    ClimateHeaderBar As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =80
        Width: =Parent.Width
        X: =0
        Y: =0
        ZIndex: =1

        ClimateBackButton As button:
            BorderColor: =McLarenOrange
            BorderThickness: =2
            Color: =McLarenWhite
            Fill: =Transparent
            Font: =Font.'Segoe UI'
            Height: =50
            OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Text: ="◄ BACK"
            Width: =120
            X: =20
            Y: =15
            ZIndex: =1

        ClimateScreenTitle As label:
            Align: =Align.Center
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =22
            Text: ="CLIMATE CONTROL"
            Width: =300
            X: =Parent.Width / 2 - Self.Width / 2
            Y: =20
            ZIndex: =2

        ClimateSaveButton As button:
            Color: =McLarenBlack
            Fill: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =50
            OnSelect: |-
                =Set(varTemperature, TemperatureSlider.Value);
                Notify("Climate settings saved!", NotificationType.Success)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Text: ="SAVE"
            Width: =120
            X: =Parent.Width - 140
            Y: =15
            ZIndex: =3

    TemperatureCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =200
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =Parent.Width - 80
        X: =40
        Y: =120
        ZIndex: =2

        TemperatureTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =18
            Text: ="TEMPERATURE"
            Width: =200
            X: =30
            Y: =20
            ZIndex: =1

        TemperatureValue As label:
            Align: =Align.Center
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =36
            Text: =Text(TemperatureSlider.Value, "0") & "°C"
            Width: =150
            X: =Parent.Width / 2 - Self.Width / 2
            Y: =60
            ZIndex: =2

        TemperatureSlider As slider:
            Default: =varTemperature
            HandleFill: =McLarenWhite
            Height: =50
            Max: =28
            Min: =16
            RailFill: =McLarenSilver
            ShowValue: =false
            ValueFill: =McLarenOrange
            Width: =Parent.Width - 160
            X: =80
            Y: =130
            ZIndex: =3

        MinTempLabel As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =25
            Size: =12
            Text: ="16°C"
            Width: =50
            X: =30
            Y: =140
            ZIndex: =4

        MaxTempLabel As label:
            Align: =Align.Right
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =25
            Size: =12
            Text: ="28°C"
            Width: =50
            X: =Parent.Width - 80
            Y: =140
            ZIndex: =5

    HeatedSeatsCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =150
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =(Parent.Width - 100) / 2
        X: =40
        Y: =340
        ZIndex: =3

        HeatedSeatsTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="HEATED SEATS"
            Width: =200
            X: =20
            Y: =20
            ZIndex: =1

        HeatedSeatsRadio As radio:
            Color: =McLarenWhite
            Default: =varHeatedSeats
            Height: =80
            Items: =["Off", "Low", "Medium", "High"]
            Layout: =Layout.Horizontal
            RadioBackgroundFill: =McLarenBlack
            RadioBorderColor: =McLarenOrange
            RadioSelectionFill: =McLarenOrange
            Size: =14
            Width: =Parent.Width - 40
            X: =20
            Y: =55
            ZIndex: =2

    VentilatedSeatsCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =150
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =(Parent.Width - 100) / 2
        X: =(Parent.Width + 20) / 2
        Y: =340
        ZIndex: =4

        VentilatedSeatsTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="VENTILATED SEATS"
            Width: =220
            X: =20
            Y: =20
            ZIndex: =1

        VentilatedSeatsRadio As radio:
            Color: =McLarenWhite
            Default: =varVentilatedSeats
            Height: =80
            Items: =["Off", "Low", "Medium", "High"]
            Layout: =Layout.Horizontal
            RadioBackgroundFill: =McLarenBlack
            RadioBorderColor: =McLarenOrange
            RadioSelectionFill: =McLarenOrange
            Size: =14
            Width: =Parent.Width - 40
            X: =20
            Y: =55
            ZIndex: =2

    HeatedWheelCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =80
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =Parent.Width - 80
        X: =40
        Y: =510
        ZIndex: =5

        HeatedWheelTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="HEATED STEERING WHEEL"
            Width: =300
            X: =30
            Y: =25
            ZIndex: =1

        HeatedWheelToggle As toggle:
            Default: =varHeatedSteeringWheel
            FalseFill: =McLarenSilver
            Height: =40
            OffText: ="OFF"
            OnText: ="ON"
            TrueFill: =McLarenOrange
            Width: =120
            X: =Parent.Width - 150
            Y: =20
            ZIndex: =2

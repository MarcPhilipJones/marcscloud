DrivingScreen As screen:
    Fill: =McLarenBlack

    DrivingHeaderBar As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =80
        Width: =Parent.Width
        X: =0
        Y: =0
        ZIndex: =1

        DrivingBackButton As button:
            BorderColor: =McLarenOrange
            BorderThickness: =2
            Color: =McLarenWhite
            Fill: =Transparent
            Font: =Font.'Segoe UI'
            Height: =50
            OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Text: ="◄ BACK"
            Width: =120
            X: =20
            Y: =15
            ZIndex: =1

        DrivingScreenTitle As label:
            Align: =Align.Center
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =22
            Text: ="DRIVING MODES"
            Width: =300
            X: =Parent.Width / 2 - Self.Width / 2
            Y: =20
            ZIndex: =2

        DrivingSaveButton As button:
            Color: =McLarenBlack
            Fill: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =50
            OnSelect: |-
                =Set(varDriveMode, DriveModeRadio.Selected.Value);
                Set(varSteeringWeight, SteeringSlider.Value);
                Set(varSuspension, SuspensionSlider.Value);
                Set(varESC, ESCRadio.Selected.Value);
                Set(varLaunchControl, LaunchControlToggle.Value);
                Set(varActiveAero, ActiveAeroRadio.Selected.Value);
                Notify("Driving settings saved!", NotificationType.Success)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Text: ="SAVE"
            Width: =120
            X: =Parent.Width - 140
            Y: =15
            ZIndex: =3

    DriveModeCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =130
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =Parent.Width - 80
        X: =40
        Y: =120
        ZIndex: =2

        DriveModeTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="DEFAULT DRIVE MODE"
            Width: =300
            X: =30
            Y: =20
            ZIndex: =1

        DriveModeRadio As radio:
            Color: =McLarenWhite
            Default: =varDriveMode
            Height: =60
            Items: =["Comfort", "Sport", "Track", "Wet"]
            Layout: =Layout.Horizontal
            RadioBackgroundFill: =McLarenBlack
            RadioBorderColor: =McLarenOrange
            RadioSelectionFill: =McLarenOrange
            Size: =16
            Width: =Parent.Width - 60
            X: =30
            Y: =55
            ZIndex: =2

    SteeringCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =130
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =(Parent.Width - 100) / 2
        X: =40
        Y: =270
        ZIndex: =3

        SteeringTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="STEERING WEIGHT"
            Width: =250
            X: =30
            Y: =20
            ZIndex: =1

        SteeringLabel As label:
            Align: =Align.Right
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =14
            Text: =Switch(Round(SteeringSlider.Value, 0), 0, "LIGHT", 1, "SPORT", 2, "HEAVY")
            Width: =100
            X: =Parent.Width - 130
            Y: =20
            ZIndex: =2

        SteeringSlider As slider:
            Default: =varSteeringWeight
            HandleFill: =McLarenWhite
            Height: =40
            Max: =2
            Min: =0
            RailFill: =McLarenSilver
            ShowValue: =false
            ValueFill: =McLarenOrange
            Width: =Parent.Width - 60
            X: =30
            Y: =60
            ZIndex: =3

        LightLabel As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =20
            Size: =10
            Text: ="Light"
            Width: =50
            X: =30
            Y: =100
            ZIndex: =4

        HeavyLabel As label:
            Align: =Align.Right
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =20
            Size: =10
            Text: ="Heavy"
            Width: =50
            X: =Parent.Width - 80
            Y: =100
            ZIndex: =5

    SuspensionCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =130
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =(Parent.Width - 100) / 2
        X: =(Parent.Width + 20) / 2
        Y: =270
        ZIndex: =4

        SuspensionTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="SUSPENSION"
            Width: =200
            X: =30
            Y: =20
            ZIndex: =1

        SuspensionLabel As label:
            Align: =Align.Right
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =14
            Text: =Switch(Round(SuspensionSlider.Value, 0), 0, "COMFORT", 1, "SPORT", 2, "TRACK")
            Width: =100
            X: =Parent.Width - 130
            Y: =20
            ZIndex: =2

        SuspensionSlider As slider:
            Default: =varSuspension
            HandleFill: =McLarenWhite
            Height: =40
            Max: =2
            Min: =0
            RailFill: =McLarenSilver
            ShowValue: =false
            ValueFill: =McLarenOrange
            Width: =Parent.Width - 60
            X: =30
            Y: =60
            ZIndex: =3

        ComfortLabel As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =20
            Size: =10
            Text: ="Comfort"
            Width: =60
            X: =30
            Y: =100
            ZIndex: =4

        TrackLabel As label:
            Align: =Align.Right
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =20
            Size: =10
            Text: ="Track"
            Width: =50
            X: =Parent.Width - 80
            Y: =100
            ZIndex: =5

    ESCCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =130
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =Parent.Width - 80
        X: =40
        Y: =420
        ZIndex: =5

        ESCTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="ESC SETTING"
            Width: =200
            X: =30
            Y: =20
            ZIndex: =1

        ESCRadio As radio:
            Color: =McLarenWhite
            Default: =varESC
            Height: =60
            Items: =["On", "Dynamic", "Track"]
            Layout: =Layout.Horizontal
            RadioBackgroundFill: =McLarenBlack
            RadioBorderColor: =McLarenOrange
            RadioSelectionFill: =McLarenOrange
            Size: =16
            Width: =400
            X: =30
            Y: =55
            ZIndex: =2

        LaunchControlLabel As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="LAUNCH CONTROL"
            Width: =200
            X: =Parent.Width - 350
            Y: =20
            ZIndex: =3

        LaunchControlToggle As toggle:
            Default: =varLaunchControl
            FalseFill: =McLarenBlack
            FalseHoverFill: =McLarenDarkGrey
            HandleFill: =McLarenWhite
            Height: =40
            OffText: ="OFF"
            OnText: ="ON"
            TextPosition: =TextPosition.Left
            TrueFill: =McLarenOrange
            TrueHoverFill: =ColorFade(McLarenOrange, -10%)
            Width: =120
            X: =Parent.Width - 150
            Y: =55
            ZIndex: =4

    ActiveAeroCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =130
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =Parent.Width - 80
        X: =40
        Y: =570
        ZIndex: =6

        ActiveAeroTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="ACTIVE AERO"
            Width: =200
            X: =30
            Y: =20
            ZIndex: =1

        ActiveAeroRadio As radio:
            Color: =McLarenWhite
            Default: =varActiveAero
            Height: =60
            Items: =["Auto", "Low Drag", "High Downforce"]
            Layout: =Layout.Horizontal
            RadioBackgroundFill: =McLarenBlack
            RadioBorderColor: =McLarenOrange
            RadioSelectionFill: =McLarenOrange
            Size: =16
            Width: =Parent.Width - 60
            X: =30
            Y: =55
            ZIndex: =2

AudioScreen As screen:
    Fill: =McLarenBlack

    AudioHeaderBar As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =80
        Width: =Parent.Width
        X: =0
        Y: =0
        ZIndex: =1

        AudioBackButton As button:
            BorderColor: =McLarenOrange
            BorderThickness: =2
            Color: =McLarenWhite
            Fill: =Transparent
            Font: =Font.'Segoe UI'
            Height: =50
            OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Text: ="◄ BACK"
            Width: =120
            X: =20
            Y: =15
            ZIndex: =1

        AudioScreenTitle As label:
            Align: =Align.Center
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =22
            Text: ="AUDIO SETTINGS"
            Width: =300
            X: =Parent.Width / 2 - Self.Width / 2
            Y: =20
            ZIndex: =2

        AudioSaveButton As button:
            Color: =McLarenBlack
            Fill: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =50
            OnSelect: |-
                =Set(varRadioStation1, RadioStation1Input.Text);
                Set(varRadioStation2, RadioStation2Input.Text);
                Set(varRadioStation3, RadioStation3Input.Text);
                Set(varAudioSource, AudioSourceRadio.Selected.Value);
                Set(varBassLevel, BassSlider.Value);
                Set(varTrebleLevel, TrebleSlider.Value);
                Set(varNavVolume, NavVolumeRadio.Selected.Value);
                Notify("Audio settings saved!", NotificationType.Success)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Text: ="SAVE"
            Width: =120
            X: =Parent.Width - 140
            Y: =15
            ZIndex: =3

    RadioStationsCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =200
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =Parent.Width - 80
        X: =40
        Y: =120
        ZIndex: =2

        RadioStationsTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="FAVOURITE RADIO STATIONS"
            Width: =400
            X: =30
            Y: =20
            ZIndex: =1

        Radio1Label As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =30
            Size: =14
            Text: ="1."
            Width: =30
            X: =30
            Y: =60
            ZIndex: =2

        RadioStation1Input As textInput:
            BorderColor: =McLarenOrange
            BorderThickness: =1
            Color: =McLarenWhite
            Default: =varRadioStation1
            Fill: =McLarenBlack
            Height: =40
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =300
            X: =60
            Y: =55
            ZIndex: =3

        Radio2Label As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =30
            Size: =14
            Text: ="2."
            Width: =30
            X: =30
            Y: =105
            ZIndex: =4

        RadioStation2Input As textInput:
            BorderColor: =McLarenOrange
            BorderThickness: =1
            Color: =McLarenWhite
            Default: =varRadioStation2
            Fill: =McLarenBlack
            Height: =40
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =300
            X: =60
            Y: =100
            ZIndex: =5

        Radio3Label As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =30
            Size: =14
            Text: ="3."
            Width: =30
            X: =30
            Y: =150
            ZIndex: =6

        RadioStation3Input As textInput:
            BorderColor: =McLarenOrange
            BorderThickness: =1
            Color: =McLarenWhite
            Default: =varRadioStation3
            Fill: =McLarenBlack
            Height: =40
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =300
            X: =60
            Y: =145
            ZIndex: =7

    AudioSourceCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =120
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =Parent.Width - 80
        X: =40
        Y: =340
        ZIndex: =3

        AudioSourceTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="DEFAULT AUDIO SOURCE"
            Width: =300
            X: =30
            Y: =20
            ZIndex: =1

        AudioSourceRadio As radio:
            Color: =McLarenWhite
            Default: =varAudioSource
            Height: =50
            Items: =["Radio", "Bluetooth", "USB", "Streaming"]
            Layout: =Layout.Horizontal
            RadioBackgroundFill: =McLarenBlack
            RadioBorderColor: =McLarenOrange
            RadioSelectionFill: =McLarenOrange
            Size: =14
            Width: =Parent.Width - 60
            X: =30
            Y: =55
            ZIndex: =2

    EqualizerCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =180
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =(Parent.Width - 100) / 2
        X: =40
        Y: =480
        ZIndex: =4

        EqualizerTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="EQUALIZER"
            Width: =200
            X: =30
            Y: =20
            ZIndex: =1

        BassLabel As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =25
            Size: =12
            Text: ="BASS"
            Width: =60
            X: =30
            Y: =60
            ZIndex: =2

        BassValue As label:
            Align: =Align.Right
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =25
            Size: =14
            Text: =If(BassSlider.Value >= 0, "+" & Text(BassSlider.Value, "0"), Text(BassSlider.Value, "0"))
            Width: =50
            X: =Parent.Width - 80
            Y: =60
            ZIndex: =3

        BassSlider As slider:
            Default: =varBassLevel
            HandleFill: =McLarenWhite
            Height: =30
            Max: =10
            Min: =-10
            RailFill: =McLarenSilver
            ShowValue: =false
            ValueFill: =McLarenOrange
            Width: =Parent.Width - 60
            X: =30
            Y: =85
            ZIndex: =4

        TrebleLabel As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =25
            Size: =12
            Text: ="TREBLE"
            Width: =60
            X: =30
            Y: =120
            ZIndex: =5

        TrebleValue As label:
            Align: =Align.Right
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =25
            Size: =14
            Text: =If(TrebleSlider.Value >= 0, "+" & Text(TrebleSlider.Value, "0"), Text(TrebleSlider.Value, "0"))
            Width: =50
            X: =Parent.Width - 80
            Y: =120
            ZIndex: =6

        TrebleSlider As slider:
            Default: =varTrebleLevel
            HandleFill: =McLarenWhite
            Height: =30
            Max: =10
            Min: =-10
            RailFill: =McLarenSilver
            ShowValue: =false
            ValueFill: =McLarenOrange
            Width: =Parent.Width - 60
            X: =30
            Y: =145
            ZIndex: =7

    NavVolumeCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =180
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =(Parent.Width - 100) / 2
        X: =(Parent.Width + 20) / 2
        Y: =480
        ZIndex: =5

        NavVolumeTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="NAV VOICE VOLUME"
            Width: =250
            X: =30
            Y: =20
            ZIndex: =1

        NavVolumeRadio As radio:
            Color: =McLarenWhite
            Default: =varNavVolume
            Height: =120
            Items: =["Off", "Low", "Medium", "High"]
            Layout: =Layout.Vertical
            RadioBackgroundFill: =McLarenBlack
            RadioBorderColor: =McLarenOrange
            RadioSelectionFill: =McLarenOrange
            Size: =14
            Width: =Parent.Width - 60
            X: =30
            Y: =55
            ZIndex: =2

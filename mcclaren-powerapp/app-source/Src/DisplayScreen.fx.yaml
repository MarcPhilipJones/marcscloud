DisplayScreen As screen:
    Fill: =McLarenBlack

    DisplayHeaderBar As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =80
        Width: =Parent.Width
        X: =0
        Y: =0
        ZIndex: =1

        DisplayBackButton As button:
            BorderColor: =McLarenOrange
            BorderThickness: =2
            Color: =McLarenWhite
            Fill: =Transparent
            Font: =Font.'Segoe UI'
            Height: =50
            OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Text: ="◄ BACK"
            Width: =120
            X: =20
            Y: =15
            ZIndex: =1

        DisplayScreenTitle As label:
            Align: =Align.Center
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =22
            Text: ="DISPLAY & LIGHTING"
            Width: =350
            X: =Parent.Width / 2 - Self.Width / 2
            Y: =20
            ZIndex: =2

        DisplaySaveButton As button:
            Color: =McLarenBlack
            Fill: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =50
            OnSelect: |-
                =Set(varClusterTheme, ClusterThemeRadio.Selected.Value);
                Set(varAmbientColor, AmbientColorRadio.Selected.Value);
                Set(varAmbientIntensity, AmbientIntensitySlider.Value);
                Set(varHUD, HUDToggle.Value);
                Set(varHUDBrightness, HUDBrightnessSlider.Value);
                Set(varWelcomeLighting, WelcomeLightingToggle.Value);
                Notify("Display settings saved!", NotificationType.Success)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Text: ="SAVE"
            Width: =120
            X: =Parent.Width - 140
            Y: =15
            ZIndex: =3

    ClusterThemeCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =150
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =Parent.Width - 80
        X: =40
        Y: =120
        ZIndex: =2

        ClusterThemeTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="INSTRUMENT CLUSTER THEME"
            Width: =400
            X: =30
            Y: =20
            ZIndex: =1

        ClusterThemeRadio As radio:
            Color: =McLarenWhite
            Default: =varClusterTheme
            Height: =80
            Items: =["Dark", "Light", "Track"]
            Layout: =Layout.Horizontal
            RadioBackgroundFill: =McLarenBlack
            RadioBorderColor: =McLarenOrange
            RadioSelectionFill: =McLarenOrange
            Size: =18
            Width: =Parent.Width - 60
            X: =30
            Y: =55
            ZIndex: =2

    AmbientLightingCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =200
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =Parent.Width - 80
        X: =40
        Y: =290
        ZIndex: =3

        AmbientLightingTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="AMBIENT LIGHTING"
            Width: =250
            X: =30
            Y: =20
            ZIndex: =1

        ColorLabel As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =25
            Size: =12
            Text: ="COLOR:"
            Width: =60
            X: =30
            Y: =60
            ZIndex: =2

        AmbientColorRadio As radio:
            Color: =McLarenWhite
            Default: =varAmbientColor
            Height: =50
            Items: =["McLaren Orange", "White", "Blue", "Red"]
            Layout: =Layout.Horizontal
            RadioBackgroundFill: =McLarenBlack
            RadioBorderColor: =McLarenOrange
            RadioSelectionFill: =McLarenOrange
            Size: =12
            Width: =Parent.Width - 120
            X: =100
            Y: =55
            ZIndex: =3

        IntensityLabel As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =25
            Size: =12
            Text: ="INTENSITY:"
            Width: =80
            X: =30
            Y: =120
            ZIndex: =4

        IntensityValue As label:
            Align: =Align.Right
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =25
            Size: =14
            Text: =Text(AmbientIntensitySlider.Value, "0") & "%"
            Width: =60
            X: =Parent.Width - 90
            Y: =120
            ZIndex: =5

        AmbientIntensitySlider As slider:
            Default: =varAmbientIntensity
            HandleFill: =McLarenWhite
            Height: =40
            Max: =100
            Min: =0
            RailFill: =McLarenSilver
            ShowValue: =false
            ValueFill: =McLarenOrange
            Width: =Parent.Width - 60
            X: =30
            Y: =150
            ZIndex: =6

        OffIntensityLabel As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =20
            Size: =10
            Text: ="Off"
            Width: =40
            X: =30
            Y: =175
            ZIndex: =7

        BrightIntensityLabel As label:
            Align: =Align.Right
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =20
            Size: =10
            Text: ="Bright"
            Width: =50
            X: =Parent.Width - 80
            Y: =175
            ZIndex: =8

    HUDCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =150
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =(Parent.Width - 100) / 2
        X: =40
        Y: =510
        ZIndex: =4

        HUDTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="HEAD-UP DISPLAY"
            Width: =200
            X: =30
            Y: =20
            ZIndex: =1

        HUDToggle As toggle:
            Default: =varHUD
            FalseFill: =McLarenBlack
            FalseHoverFill: =McLarenDarkGrey
            HandleFill: =McLarenWhite
            Height: =40
            OffText: ="OFF"
            OnText: ="ON"
            TextPosition: =TextPosition.Left
            TrueFill: =McLarenOrange
            TrueHoverFill: =ColorFade(McLarenOrange, -10%)
            Width: =120
            X: =Parent.Width - 150
            Y: =15
            ZIndex: =2

        HUDBrightnessLabel As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =25
            Size: =12
            Text: ="BRIGHTNESS"
            Width: =100
            X: =30
            Y: =65
            ZIndex: =3

        HUDBrightnessValue As label:
            Align: =Align.Right
            Color: =McLarenOrange
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =25
            Size: =14
            Text: =Text(HUDBrightnessSlider.Value, "0") & "%"
            Width: =60
            X: =Parent.Width - 90
            Y: =65
            ZIndex: =4

        HUDBrightnessSlider As slider:
            Default: =varHUDBrightness
            DisplayMode: =If(HUDToggle.Value, DisplayMode.Edit, DisplayMode.Disabled)
            HandleFill: =McLarenWhite
            Height: =40
            Max: =100
            Min: =0
            RailFill: =McLarenSilver
            ShowValue: =false
            ValueFill: =McLarenOrange
            Width: =Parent.Width - 60
            X: =30
            Y: =95
            ZIndex: =5

    WelcomeLightingCard As groupContainer.manualLayoutContainer:
        Fill: =McLarenDarkGrey
        Height: =150
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =(Parent.Width - 100) / 2
        X: =(Parent.Width + 20) / 2
        Y: =510
        ZIndex: =5

        WelcomeLightingTitle As label:
            Color: =McLarenWhite
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =16
            Text: ="WELCOME LIGHTING"
            Width: =220
            X: =30
            Y: =20
            ZIndex: =1

        WelcomeLightingDescription As label:
            Color: =McLarenSilver
            Font: =Font.'Segoe UI'
            Height: =50
            Size: =12
            Text: ="Exterior lights activate on approach to illuminate your McLaren"
            Width: =Parent.Width - 60
            X: =30
            Y: =55
            ZIndex: =2

        WelcomeLightingToggle As toggle:
            Default: =varWelcomeLighting
            FalseFill: =McLarenBlack
            FalseHoverFill: =McLarenDarkGrey
            HandleFill: =McLarenWhite
            Height: =40
            OffText: ="OFF"
            OnText: ="ON"
            TextPosition: =TextPosition.Left
            TrueFill: =McLarenOrange
            TrueHoverFill: =ColorFade(McLarenOrange, -10%)
            Width: =120
            X: =Parent.Width / 2 - 60
            Y: =100
            ZIndex: =3

            "NavigationGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                '#CopilotOverlayLabel': ="Filtered"
                BorderColor: =App.Theme.Colors.Darker40
                DelayItemLoading: =true
                Height: =Parent.Height / 2.5
                Items: |-
                    =Table(
                        {Tab: "Dashboard"},
                        {Tab: "Incidents"},
                        {Tab: "Customers"},
                        {Tab: "FAQs"},
                        {Tab: "Settings"}
                    )
                Layout: =Layout.Vertical
                LoadingSpinner: =LoadingSpinner.Data
                OnSelect: |-
                    =/* Prepare Calendar Variables */
                    
                    // Set Calendar First Day
                    Set(FirstDayOfMonth, 
                        Date(
                            Year(Today()),
                            Month(Today()),
                            1
                        )
                    );
                    // Set SelectedDate to today
                    Set(
                        SelectedDate,
                        Today()
                    );
                    // Set FirstDayOfTheWeek to current week
                    Set(
                        FirstDayOfWeek,
                        Switch(
                            Weekday(SelectedDate),
                            7,DateAdd(SelectedDate,-6,TimeUnit.Days),
                            6,DateAdd(SelectedDate,-5,TimeUnit.Days),
                            5,DateAdd(SelectedDate,-4,TimeUnit.Days),
                            4,DateAdd(SelectedDate,-3,TimeUnit.Days),
                            3,DateAdd(SelectedDate,-2,TimeUnit.Days),
                            2,DateAdd(SelectedDate,-1,TimeUnit.Days),
                            1,DateAdd(SelectedDate,0,TimeUnit.Days),
                            Today()
                        )
                    );
                TemplatePadding: =0
                TemplateSize: =Self.Height / Self.AllItemsCount
                Width: =Parent.Width
                Y: =Image2.Y + Image2.Height + 30
                ZIndex: =3


LoadingScreen As screen:
    Fill: =RGBA(0, 0, 0, 0)
    Height: =App.Height
    Width: =App.Width

    HtmlText1 As htmlViewer:
        Height: =Parent.Height
        HtmlText: |-
            ="<div style='position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom right," &
            Mid(JSON(Primary), 2, 7) & ", " &
            Mid(JSON(Secondary), 2, 7) & ", " &
            Mid(JSON(Accent), 2, 7) &
            "); display: flex; justify-content: center; align-items: center; color: white;'>
            </div>"
        Width: =Parent.Width
        Y: |
            =0
        ZIndex: =1

    Image1 As image:
        Height: =400
        Image: ='contoso-logo'
        Width: =400
        X: =Parent.Width/2 - Self.Width/2
        Y: =Parent.Height/2 - Self.Height/2
        ZIndex: =2

    Timer1 As timer:
        AutoPause: =false
        AutoStart: =true
        Duration: =2000
        Fill: =RGBA(0, 0, 0, 1)
        OnTimerEnd: =Navigate(HomeScreen, ScreenTransition.Fade)
        Visible: =false
        X: =40
        Y: =40
        ZIndex: =3


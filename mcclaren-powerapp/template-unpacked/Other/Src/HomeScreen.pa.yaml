Screens:
  HomeScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Screen:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =App.Width
          Children:
            - SideMenu:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  FillPortions: =0
                  LayoutMinHeight: =0
                  Visible: =false
                  Width: =200
                Children:
                  - Image2:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =40
                        Image: ='contoso-horizontal-logo [GREY]'
                        Width: =Parent.Width - 40
                        X: =Parent.Width/2 - Self.Width/2
                        Y: =30
                  - NavigationUserPanel:
                      Control: GroupContainer@1.3.0
                      Variant: ManualLayout
                      Properties:
                        Height: =75
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                        Y: =Parent.Height - Self.Height
                      Children:
                        - UserAvatar_2:
                            Control: Avatar@1.0.40
                            Properties:
                              Appearance: ='Avatar.Appearance'.Neutral
                              Height: =40
                              Image: =persona
                              Name: =
                              Width: =40
                              X: =10
                              Y: =Parent.Height/2 - Self.Height/2
                        - UserName_1:
                            Control: Text@0.0.51
                            Properties:
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(0, 0, 0, 1)
                              Height: =23
                              Size: =16
                              Text: ="Evan Lewis"
                              Weight: ='TextCanvas.Weight'.Semibold
                              Width: =130
                              X: |
                                =UserAvatar_2.X + UserAvatar_2.Width + 15
                              Y: =Parent.Height/2 - (Self.Height + UserRole_1.Height)/2
                        - UserRole_1:
                            Control: Text@0.0.51
                            Properties:
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(117, 117, 117, 1)
                              Height: =20
                              Text: ="Customer"
                              Width: =130
                              X: =UserName_1.X
                              Y: =UserName_1.Y + UserName_1.Height
                        - Circle1:
                            Control: Circle@2.3.0
                            Properties:
                              Height: =3
                              Visible: =openNav
                              Width: =3
                              X: =Parent.Width - 20
                              Y: =Parent.Height/2 - (Self.Height * 3 + (2 * 3))/2
                        - Circle2:
                            Control: Circle@2.3.0
                            Properties:
                              Height: =3
                              Visible: =openNav
                              Width: =3
                              X: =Circle1.X
                              Y: |
                                =Circle1.Y + Circle1.Height + 3
                        - Circle3:
                            Control: Circle@2.3.0
                            Properties:
                              Height: =3
                              Visible: =openNav
                              Width: =3
                              X: =Circle1.X
                              Y: =Circle2.Y + Circle2.Height + 3
                  - NavigationGallery:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        Height: =Parent.Height / 2.5
                        Items: |-
                          =Table(
                              {Tab: "Dashboard"},
                              {Tab: "Incidents"},
                              {Tab: "Customers"},
                              {Tab: "FAQs"},
                              {Tab: "Settings"}
                          )
                        OnSelect: |-
                          =/* Prepare Calendar Variables */

                          // Set Calendar First Day
                          Set(FirstDayOfMonth, 
                              Date(
                                  Year(Today()),
                                  Month(Today()),
                                  1
                              )
                          );
                          // Set SelectedDate to today
                          Set(
                              SelectedDate,
                              Today()
                          );
                          // Set FirstDayOfTheWeek to current week
                          Set(
                              FirstDayOfWeek,
                              Switch(
                                  Weekday(SelectedDate),
                                  7,DateAdd(SelectedDate,-6,TimeUnit.Days),
                                  6,DateAdd(SelectedDate,-5,TimeUnit.Days),
                                  5,DateAdd(SelectedDate,-4,TimeUnit.Days),
                                  4,DateAdd(SelectedDate,-3,TimeUnit.Days),
                                  3,DateAdd(SelectedDate,-2,TimeUnit.Days),
                                  2,DateAdd(SelectedDate,-1,TimeUnit.Days),
                                  1,DateAdd(SelectedDate,0,TimeUnit.Days),
                                  Today()
                              )
                          );
                        TemplateSize: =Self.Height / Self.AllItemsCount
                        Width: =Parent.Width
                        Y: =Image2.Y + Image2.Height + 30
                      Children:
                        - NavigationText:
                            Control: Text@0.0.51
                            Properties:
                              FontColor: =RGBA(117, 117, 117, 1)
                              Text: =ThisItem.Tab
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: =openNav
                              Weight: ='TextCanvas.Weight'.Semibold
                              Width: =150
                              X: =50
                              Y: =NavigationIcon.Y + NavigationIcon.Height/2 - Self.Height/2
                        - NavigationIcon:
                            Control: Icon@0.0.7
                            Properties:
                              Height: =25
                              Icon: |-
                                =Switch(ThisItem.Tab,
                                "Dashboard", "AppsListDetail",
                                "Incidents", "Warning",
                                "Customers", "People",
                                "FAQs", "Question",
                                "Settings", "Settings")
                              IconColor: =RGBA(117, 117, 117, 1)
                              Width: =25
                              X: =17.5
                              Y: =NavigationButton.Y + NavigationButton.Height/2 - Self.Height/2
                        - NotificationCount:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(255, 255, 255, 1)
                              BorderThickness: =3
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(255, 255, 255, 1)
                              DisabledColor: =RGBA(255, 255, 255, 1)
                              DisabledFill: =RGBA(255, 0, 0, 1)
                              Fill: =RGBA(255, 0, 0, 1)
                              FocusedBorderThickness: =Self.BorderThickness
                              Height: =20
                              HoverBorderColor: =Self.BorderColor
                              HoverColor: =Self.Color
                              HoverFill: =RGBA(255, 0, 0, 1)
                              OnSelect: =Select(Parent)
                              PressedBorderColor: =Self.Color
                              PressedFill: =RGBA(255, 0, 0, 1)
                              RadiusBottomLeft: =100
                              RadiusBottomRight: =100
                              RadiusTopLeft: =100
                              RadiusTopRight: =100
                              Size: =8
                              Text: ="8"
                              Visible: =If(ThisItem.Tab = "Tasks", true, false)
                              Width: =20
                              X: =If(openNav, Parent.TemplateWidth - Self.Width - 20, NavigationIcon.X + NavigationIcon.Width - 6)
                              Y: =If(openNav, Parent.TemplateHeight/2 - Self.Height/2, NavigationIcon.Y - 6)
                        - NavigationButton:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =
                              BorderThickness: =0
                              Color: =
                              DisabledColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              Fill: =If(ThisItem.IsSelected, Self.PressedFill, RGBA(0, 0, 0, 0))
                              FocusedBorderThickness: =0
                              HoverBorderColor: =
                              HoverColor: =
                              HoverFill: =RGBA(0, 0, 0, 0.03)
                              OnSelect: =Select(Parent)
                              PressedBorderColor: =
                              PressedColor: =
                              PressedFill: =RGBA(0, 0, 0, 0.08)
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Size: =14
                              Text: =
                              Width: =Parent.TemplateWidth - 20
                              X: =10
                              Y: =Parent.TemplateHeight/2 - Self.Height/2

AudioScreen As screen:
  Fill: =McLarenBlack
  
  # Header with Back Button
  HeaderContainer As container:
    X: =0
    Y: =0
    Width: =Parent.Width
    Height: =80
    Fill: =McLarenDarkGrey
    
    BackButton As button:
      X: =20
      Y: =15
      Width: =120
      Height: =50
      Text: ="◄ BACK"
      Fill: =Transparent
      Color: =McLarenWhite
      OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
      BorderColor: =McLarenOrange
      BorderThickness: =2
      BorderRadius: =4
      
    ScreenTitle As label:
      X: =(Parent.Width - 300) / 2
      Y: =20
      Width: =300
      Height: =40
      Text: ="AUDIO SETTINGS"
      Color: =McLarenOrange
      Size: =22
      FontWeight: =FontWeight.Bold
      Align: =Align.Center
      
    SaveButton As button:
      X: =Parent.Width - 140
      Y: =15
      Width: =120
      Height: =50
      Text: ="SAVE"
      Fill: =McLarenOrange
      Color: =McLarenBlack
      FontWeight: =FontWeight.Bold
      BorderRadius: =4
      OnSelect: |
        =Patch(CustomerSettings, CustomerSettings, {
          RadioStation1: RadioStation1Input.Text,
          RadioStation2: RadioStation2Input.Text,
          RadioStation3: RadioStation3Input.Text,
          DefaultAudioSource: AudioSourceRadio.Selected.Value,
          BassLevel: BassSlider.Value,
          TrebleLevel: TrebleSlider.Value,
          NavVoiceVolume: NavVolumeRadio.Selected.Value
        });
        Notify("Audio settings saved!", NotificationType.Success)

  # Favourite Radio Stations Section
  RadioStationsCard As container:
    X: =40
    Y: =120
    Width: =Parent.Width - 80
    Height: =220
    Fill: =McLarenDarkGrey
    BorderRadius: =8
    
    RadioStationsTitle As label:
      X: =30
      Y: =20
      Width: =300
      Height: =30
      Text: ="FAVOURITE RADIO STATIONS"
      Color: =McLarenWhite
      Size: =16
      FontWeight: =FontWeight.Bold
      
    RadioIcon As icon:
      X: =Parent.Width - 60
      Y: =15
      Width: =40
      Height: =40
      Icon: =Icon.Microphone
      Color: =McLarenOrange
      
    # Station 1
    Station1Label As label:
      X: =30
      Y: =60
      Width: =30
      Height: =40
      Text: ="1."
      Color: =McLarenOrange
      Size: =18
      FontWeight: =FontWeight.Bold
      
    RadioStation1Input As textinput:
      X: =70
      Y: =60
      Width: =Parent.Width - 120
      Height: =45
      Default: =CustomerSettings.RadioStation1
      Fill: =McLarenBlack
      Color: =McLarenWhite
      BorderColor: =McLarenSilver
      FocusBorderColor: =McLarenOrange
      HintText: ="Enter station name or frequency"
      BorderRadius: =4
      
    # Station 2
    Station2Label As label:
      X: =30
      Y: =115
      Width: =30
      Height: =40
      Text: ="2."
      Color: =McLarenOrange
      Size: =18
      FontWeight: =FontWeight.Bold
      
    RadioStation2Input As textinput:
      X: =70
      Y: =115
      Width: =Parent.Width - 120
      Height: =45
      Default: =CustomerSettings.RadioStation2
      Fill: =McLarenBlack
      Color: =McLarenWhite
      BorderColor: =McLarenSilver
      FocusBorderColor: =McLarenOrange
      HintText: ="Enter station name or frequency"
      BorderRadius: =4
      
    # Station 3
    Station3Label As label:
      X: =30
      Y: =170
      Width: =30
      Height: =40
      Text: ="3."
      Color: =McLarenOrange
      Size: =18
      FontWeight: =FontWeight.Bold
      
    RadioStation3Input As textinput:
      X: =70
      Y: =170
      Width: =Parent.Width - 120
      Height: =45
      Default: =CustomerSettings.RadioStation3
      Fill: =McLarenBlack
      Color: =McLarenWhite
      BorderColor: =McLarenSilver
      FocusBorderColor: =McLarenOrange
      HintText: ="Enter station name or frequency"
      BorderRadius: =4

  # Default Audio Source Section
  AudioSourceCard As container:
    X: =40
    Y: =360
    Width: =Parent.Width - 80
    Height: =120
    Fill: =McLarenDarkGrey
    BorderRadius: =8
    
    AudioSourceTitle As label:
      X: =30
      Y: =20
      Width: =250
      Height: =30
      Text: ="DEFAULT AUDIO SOURCE"
      Color: =McLarenWhite
      Size: =16
      FontWeight: =FontWeight.Bold
      
    AudioSourceRadio As radio:
      X: =30
      Y: =55
      Width: =Parent.Width - 60
      Height: =50
      Items: =["Radio", "Bluetooth", "USB", "Streaming"]
      Default: =CustomerSettings.DefaultAudioSource
      Layout: =Layout.Horizontal
      RadioBackgroundFill: =McLarenBlack
      RadioBorderColor: =McLarenOrange
      RadioSelectionFill: =McLarenOrange
      Color: =McLarenWhite
      Size: =14

  # Equalizer Section
  EqualizerCard As container:
    X: =40
    Y: =500
    Width: =Parent.Width - 80
    Height: =160
    Fill: =McLarenDarkGrey
    BorderRadius: =8
    
    EqualizerTitle As label:
      X: =30
      Y: =20
      Width: =150
      Height: =30
      Text: ="EQUALIZER"
      Color: =McLarenWhite
      Size: =16
      FontWeight: =FontWeight.Bold
      
    # Bass Section
    BassLabel As label:
      X: =30
      Y: =60
      Width: =60
      Height: =30
      Text: ="BASS"
      Color: =McLarenSilver
      Size: =12
      
    BassValue As label:
      X: =(Parent.Width / 2) - 130
      Y: =60
      Width: =50
      Height: =30
      Text: =If(BassSlider.Value > 0, "+" & Text(BassSlider.Value, "0"), Text(BassSlider.Value, "0"))
      Color: =McLarenOrange
      Size: =14
      FontWeight: =FontWeight.Bold
      Align: =Align.Right
      
    BassSlider As slider:
      X: =100
      Y: =90
      Width: =(Parent.Width / 2) - 130
      Height: =40
      Min: =-10
      Max: =10
      Default: =CustomerSettings.BassLevel
      ValueFill: =McLarenOrange
      HandleFill: =McLarenWhite
      RailFill: =McLarenSilver
      ShowValue: =false
      
    # Treble Section
    TrebleLabel As label:
      X: =(Parent.Width / 2) + 30
      Y: =60
      Width: =80
      Height: =30
      Text: ="TREBLE"
      Color: =McLarenSilver
      Size: =12
      
    TrebleValue As label:
      X: =Parent.Width - 80
      Y: =60
      Width: =50
      Height: =30
      Text: =If(TrebleSlider.Value > 0, "+" & Text(TrebleSlider.Value, "0"), Text(TrebleSlider.Value, "0"))
      Color: =McLarenOrange
      Size: =14
      FontWeight: =FontWeight.Bold
      Align: =Align.Right
      
    TrebleSlider As slider:
      X: =(Parent.Width / 2) + 30
      Y: =90
      Width: =(Parent.Width / 2) - 80
      Height: =40
      Min: =-10
      Max: =10
      Default: =CustomerSettings.TrebleLevel
      ValueFill: =McLarenOrange
      HandleFill: =McLarenWhite
      RailFill: =McLarenSilver
      ShowValue: =false

  # Navigation Voice Volume Section
  NavVolumeCard As container:
    X: =40
    Y: =680
    Width: =Parent.Width - 80
    Height: =100
    Fill: =McLarenDarkGrey
    BorderRadius: =8
    
    NavVolumeTitle As label:
      X: =30
      Y: =20
      Width: =280
      Height: =30
      Text: ="NAVIGATION VOICE VOLUME"
      Color: =McLarenWhite
      Size: =16
      FontWeight: =FontWeight.Bold
      
    NavVolumeRadio As radio:
      X: =30
      Y: =55
      Width: =Parent.Width - 60
      Height: =40
      Items: =["Off", "Low", "Medium", "High"]
      Default: =CustomerSettings.NavVoiceVolume
      Layout: =Layout.Horizontal
      RadioBackgroundFill: =McLarenBlack
      RadioBorderColor: =McLarenOrange
      RadioSelectionFill: =McLarenOrange
      Color: =McLarenWhite
      Size: =14

DisplayScreen As screen:
    Fill: =McLarenBlack

    DisplayBackgroundImage As image:
        Height: =Parent.Height
        Image: ="https://www.contosodemos.co.uk/mclaren-570s-spider-home.jpg"
        ImagePosition: =ImagePosition.Fill
        Transparency: =0.82
        Width: =Parent.Width
        X: =0
        Y: =0
        ZIndex: =0

    DisplayBackBtn As button:
        BorderColor: =McLarenOrange
        BorderThickness: =2
        Color: =McLarenWhite
        Fill: =Color.Transparent
        Font: =Font.'Segoe UI'
        Height: =50
        OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
        Text: ="< BACK"
        Width: =120
        X: =20
        Y: =15
        ZIndex: =1

    DisplayTitle As label:
        Align: =Align.Center
        Color: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =40
        Size: =24
        Text: ="DISPLAY AND LIGHTING"
        Width: =400
        X: =Parent.Width / 2 - Self.Width / 2
        Y: =20
        ZIndex: =2

    DisplaySaveBtn As button:
        Color: =McLarenBlack
        Fill: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =50
        OnSelect: =Notify("Display settings saved!", NotificationType.Success)
        Text: ="SAVE"
        Width: =120
        X: =Parent.Width - 140
        Y: =15
        ZIndex: =3

    ClusterThemeCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =120
        Size: =16
        Text: ="INSTRUMENT CLUSTER THEME - Add radio buttons in Studio (Classic / Sport / Track / Minimal)"
        Width: =Parent.Width - 80
        X: =40
        Y: =90
        ZIndex: =4

    AmbientColorCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =120
        Size: =16
        Text: ="AMBIENT LIGHTING COLOR - Add dropdown in Studio"
        Width: =(Parent.Width - 100) / 2
        X: =40
        Y: =230
        ZIndex: =5

    AmbientIntensityCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =120
        Size: =16
        Text: ="AMBIENT INTENSITY"
        Width: =(Parent.Width - 100) / 2
        X: =(Parent.Width + 20) / 2
        Y: =230
        ZIndex: =6

    AmbientDisplay As label:
        Align: =Align.Right
        Color: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =30
        Size: =20
        Text: =Text(AmbientSlider.Value, "0") & "%"
        Width: =80
        X: =Parent.Width - 100
        Y: =240
        ZIndex: =7

    AmbientSlider As slider:
        Default: =varAmbientIntensity
        HandleFill: =McLarenWhite
        Height: =35
        Max: =100
        Min: =0
        RailFill: =McLarenSilver
        ShowValue: =false
        ValueFill: =McLarenOrange
        Width: =(Parent.Width - 180) / 2
        X: =(Parent.Width + 60) / 2
        Y: =295
        ZIndex: =8

    HUDCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =120
        Size: =16
        Text: ="HEAD-UP DISPLAY - Add toggle in Studio"
        Width: =(Parent.Width - 100) / 2
        X: =40
        Y: =370
        ZIndex: =9

    HUDBrightnessCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =120
        Size: =16
        Text: ="HUD BRIGHTNESS"
        Width: =(Parent.Width - 100) / 2
        X: =(Parent.Width + 20) / 2
        Y: =370
        ZIndex: =10

    HUDBrightnessDisplay As label:
        Align: =Align.Right
        Color: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =30
        Size: =20
        Text: =Text(HUDBrightnessSlider.Value, "0") & "%"
        Width: =80
        X: =Parent.Width - 100
        Y: =380
        ZIndex: =11

    HUDBrightnessSlider As slider:
        Default: =varHUDBrightness
        HandleFill: =McLarenWhite
        Height: =35
        Max: =100
        Min: =0
        RailFill: =McLarenSilver
        ShowValue: =false
        ValueFill: =McLarenOrange
        Width: =(Parent.Width - 180) / 2
        X: =(Parent.Width + 60) / 2
        Y: =435
        ZIndex: =12



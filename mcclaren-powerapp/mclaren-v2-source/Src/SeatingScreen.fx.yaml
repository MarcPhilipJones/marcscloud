SeatingScreen As screen:
    Fill: =McLarenBlack

    SeatingBackgroundImage As image:
        Height: =Parent.Height
        Image: ="https://www.contosodemos.co.uk/mclaren-570s-spider-home.jpg"
        ImagePosition: =ImagePosition.Fill
        Transparency: =0.82
        Width: =Parent.Width
        X: =0
        Y: =0
        ZIndex: =0

    SeatingBackBtn As button:
        BorderColor: =McLarenOrange
        BorderThickness: =2
        Color: =McLarenWhite
        Fill: =Color.Transparent
        Font: =Font.'Segoe UI'
        Height: =50
        OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
        Text: ="< BACK"
        Width: =120
        X: =20
        Y: =15
        ZIndex: =1

    SeatingTitle As label:
        Align: =Align.Center
        Color: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =40
        Size: =24
        Text: ="SEATING POSITION"
        Width: =400
        X: =Parent.Width / 2 - Self.Width / 2
        Y: =20
        ZIndex: =2

    SeatingSaveBtn As button:
        Color: =McLarenBlack
        Fill: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =50
        OnSelect: =Notify("Seating settings saved!", NotificationType.Success)
        Text: ="SAVE"
        Width: =120
        X: =Parent.Width - 140
        Y: =15
        ZIndex: =3

    SeatPosCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =140
        Size: =16
        Text: ="SEAT POSITION"
        Width: =(Parent.Width - 100) / 2
        X: =40
        Y: =100
        ZIndex: =4

    SeatPosDisplay As label:
        Align: =Align.Right
        Color: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =30
        Size: =20
        Text: =Text(SeatPosSlider.Value, "0") & "%"
        Width: =80
        X: =((Parent.Width - 100) / 2) - 50
        Y: =110
        ZIndex: =5

    SeatPosSlider As slider:
        Default: =varSeatPosition
        HandleFill: =McLarenWhite
        Height: =35
        Max: =100
        Min: =0
        RailFill: =McLarenSilver
        ShowValue: =false
        ValueFill: =McLarenOrange
        Width: =(Parent.Width - 180) / 2
        X: =60
        Y: =170
        ZIndex: =6

    SeatHeightCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =140
        Size: =16
        Text: ="SEAT HEIGHT"
        Width: =(Parent.Width - 100) / 2
        X: =(Parent.Width + 20) / 2
        Y: =100
        ZIndex: =7

    SeatHeightDisplay As label:
        Align: =Align.Right
        Color: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =30
        Size: =20
        Text: =Text(SeatHeightSlider.Value, "0") & "%"
        Width: =80
        X: =Parent.Width - 100
        Y: =110
        ZIndex: =8

    SeatHeightSlider As slider:
        Default: =varSeatHeight
        HandleFill: =McLarenWhite
        Height: =35
        Max: =100
        Min: =0
        RailFill: =McLarenSilver
        ShowValue: =false
        ValueFill: =McLarenOrange
        Width: =(Parent.Width - 180) / 2
        X: =(Parent.Width + 60) / 2
        Y: =170
        ZIndex: =9

    BackrestCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =140
        Size: =16
        Text: ="BACKREST ANGLE"
        Width: =(Parent.Width - 100) / 2
        X: =40
        Y: =260
        ZIndex: =10

    BackrestDisplay As label:
        Align: =Align.Right
        Color: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =30
        Size: =20
        Text: =Text(BackrestSlider.Value, "0") & " deg"
        Width: =80
        X: =((Parent.Width - 100) / 2) - 50
        Y: =270
        ZIndex: =11

    BackrestSlider As slider:
        Default: =varBackrestAngle
        HandleFill: =McLarenWhite
        Height: =35
        Max: =45
        Min: =15
        RailFill: =McLarenSilver
        ShowValue: =false
        ValueFill: =McLarenOrange
        Width: =(Parent.Width - 180) / 2
        X: =60
        Y: =330
        ZIndex: =12

    LumbarCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =140
        Size: =16
        Text: ="LUMBAR SUPPORT"
        Width: =(Parent.Width - 100) / 2
        X: =(Parent.Width + 20) / 2
        Y: =260
        ZIndex: =13

    LumbarDisplay As label:
        Align: =Align.Right
        Color: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =30
        Size: =20
        Text: =Text(LumbarSlider.Value, "0") & "%"
        Width: =80
        X: =Parent.Width - 100
        Y: =270
        ZIndex: =14

    LumbarSlider As slider:
        Default: =varLumbarSupport
        HandleFill: =McLarenWhite
        Height: =35
        Max: =100
        Min: =0
        RailFill: =McLarenSilver
        ShowValue: =false
        ValueFill: =McLarenOrange
        Width: =(Parent.Width - 180) / 2
        X: =(Parent.Width + 60) / 2
        Y: =330
        ZIndex: =15



HomeScreen As screen:
    Fill: =McLarenBlack

    BackgroundImage As image:
        Height: =Parent.Height
        Image: ="https://www.contosodemos.co.uk/mclaren-570s-spider-home.jpg"
        ImagePosition: =ImagePosition.Fill
        Transparency: =0.82
        Width: =Parent.Width
        X: =0
        Y: =0
        ZIndex: =0

    AppTitle As label:
        Align: =Align.Center
        Color: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =40
        Size: =28
        Text: ="McLAREN"
        Width: =Parent.Width
        X: =0
        Y: =15
        ZIndex: =1

    AppSubtitle As label:
        Align: =Align.Center
        Color: =McLarenWhite
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =20
        Size: =12
        Text: ="PERSONALISATION SUITE"
        Width: =Parent.Width
        X: =0
        Y: =55
        ZIndex: =2

    CustomerNameLabel As label:
        Align: =Align.Center
        Color: =McLarenWhite

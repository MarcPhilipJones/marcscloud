DrivingScreen As screen:
    Fill: =McLarenBlack

    DrivingBackgroundImage As image:
        Height: =Parent.Height
        Image: ="https://www.contosodemos.co.uk/mclaren-570s-spider-home.jpg"
        ImagePosition: =ImagePosition.Fill
        Transparency: =0.82
        Width: =Parent.Width
        X: =0
        Y: =0
        ZIndex: =0

    DrivingBackBtn As button:
        BorderColor: =McLarenOrange
        BorderThickness: =2
        Color: =McLarenWhite
        Fill: =Color.Transparent
        Font: =Font.'Segoe UI'
        Height: =50
        OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
        Text: ="< BACK"
        Width: =120
        X: =20
        Y: =15
        ZIndex: =1

    DrivingTitle As label:
        Align: =Align.Center
        Color: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =40
        Size: =24
        Text: ="DRIVING DYNAMICS"
        Width: =400
        X: =Parent.Width / 2 - Self.Width / 2
        Y: =20
        ZIndex: =2

    DrivingSaveBtn As button:
        Color: =McLarenBlack
        Fill: =McLarenOrange
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =50
        OnSelect: =Notify("Driving settings saved!", NotificationType.Success)
        Text: ="SAVE"
        Width: =120
        X: =Parent.Width - 140
        Y: =15
        ZIndex: =3

    DriveModeCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =120
        Size: =16
        Text: ="DRIVE MODE - Add radio buttons in Studio (Comfort / Sport / Track)"
        Width: =Parent.Width - 80
        X: =40
        Y: =90
        ZIndex: =4

    ComfortBtn As button:
        BorderColor: =RGBA(255, 128, 0, 1)
        BorderThickness: =2
        Color: =RGBA(255, 255, 255, 1)
        Fill: =If(varDriveMode = "Comfort", RGBA(255, 128, 0, 1), RGBA(0, 0, 0, 0))
        Font: =Font.'Segoe UI'
        Height: =50
        OnSelect: =Set(varDriveMode, "Comfort")
        Text: ="COMFORT"
        Width: =200
        X: =80
        Y: =140
        ZIndex: =5

    SportBtn As button:
        BorderColor: =RGBA(255, 128, 0, 1)
        BorderThickness: =2
        Color: =RGBA(255, 255, 255, 1)
        Fill: =If(varDriveMode = "Sport", RGBA(255, 128, 0, 1), RGBA(0, 0, 0, 0))
        Font: =Font.'Segoe UI'
        Height: =50
        OnSelect: =Set(varDriveMode, "Sport")
        Text: ="SPORT"
        Width: =200
        X: =Parent.Width / 2 - 100
        Y: =140
        ZIndex: =6

    TrackBtn As button:
        BorderColor: =RGBA(255, 128, 0, 1)
        BorderThickness: =2
        Color: =RGBA(255, 255, 255, 1)
        Fill: =If(varDriveMode = "Track", RGBA(255, 128, 0, 1), RGBA(0, 0, 0, 0))
        Font: =Font.'Segoe UI'
        Height: =50
        OnSelect: =Set(varDriveMode, "Track")
        Text: ="TRACK"
        Width: =200
        X: =Parent.Width - 280
        Y: =140
        ZIndex: =7

    SteeringCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =120
        Size: =16
        Text: ="STEERING WEIGHT - Add radio buttons in Studio"
        Width: =(Parent.Width - 100) / 2
        X: =40
        Y: =240
        ZIndex: =8

    SuspensionCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =120
        Size: =16
        Text: ="SUSPENSION - Add radio buttons in Studio"
        Width: =(Parent.Width - 100) / 2
        X: =(Parent.Width + 20) / 2
        Y: =240
        ZIndex: =9

    ESCCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =120
        Size: =16
        Text: ="ESC MODE - Add radio buttons in Studio"
        Width: =Parent.Width - 80
        X: =40
        Y: =380
        ZIndex: =10

    LaunchCard As label:
        Color: =McLarenWhite
        Fill: =McLarenDarkGrey
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =100
        Size: =16
        Text: ="LAUNCH CONTROL / ACTIVE AERO - Add toggles in Studio"
        Width: =Parent.Width - 80
        X: =40
        Y: =520
        ZIndex: =11



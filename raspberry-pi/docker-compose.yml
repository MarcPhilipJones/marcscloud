# Raspberry Pi 5 Docker Stack
# Deploy: scp docker-compose.yml admin@192.168.0.111:~/docker-compose.yml
# Then:   ssh pi5 "cd ~ && docker compose up -d"

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN  # Bluetooth adapter management (avoids degraded mode)
      - NET_RAW    # Bluetooth raw advertising data + adapter recovery
    volumes:
      - /home/admin/homeassistant:/config
      - /run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # Manual HA updates only

  heimdall:
    container_name: heimdall
    image: linuxserver/heimdall:latest
    restart: unless-stopped
    ports:
      - "8201:80"
      - "8200:443"
    volumes:
      - /home/admin/heimdall:/config
    environment:
      - PUID=1000
      - PGID=1000

  changedetection:
    container_name: changedetection
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /opt/changedetection/data:/datastore

  homebridge:
    container_name: homebridge
    image: homebridge/homebridge:latest
    restart: always
    network_mode: host
    volumes:
      - /home/admin/homebridge:/homebridge
    environment:
      - TZ=Europe/London
      - PUID=1026
      - PGID=100
      - HOMEBRIDGE_CONFIG_UI=1
      - HOMEBRIDGE_CONFIG_UI_PORT=8581

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  scrypted:
    container_name: scrypted
    image: ghcr.io/koush/scrypted:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - scrypted_scrypted-data:/server/volume:rw
      - scrypted_scrypted-cache:/server/cache:rw
      - /var/run/dbus:/var/run/dbus:rw
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket:rw
    environment:
      - TZ=Europe/London

  matter-server:
    container_name: matter-server
    # Migrated 2026-06-26 from python-matter-server (EOL) to the matter.js server.
    # Pinned (not :stable) due to Beta status. Data dir must be owned by UID 1000
    # (the matter.js container runs unprivileged): sudo chown -R 1000:1000 /mnt/data/matter-server
    image: ghcr.io/matter-js/matterjs-server:1.1.2
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/data/matter-server:/data

  # ---------------------------------------------------------------------------
  # TeslaMate stack (added 2026-06-26 — replaces the paid TeslaFi subscription).
  # Versions PINNED: teslamate/grafana 4.0.1 is the release that fixed the Owner
  # API auth-host 403 (HTTP/2 + TLS 1.3). Secrets live in ~/.env on the Pi only
  # (git-ignored) — see .env.teslamate.example. Data under /mnt/data/teslamate.
  # LAN-only: do NOT expose ports 3000/4000 to the internet.
  # ---------------------------------------------------------------------------
  teslamate:
    container_name: teslamate
    image: teslamate/teslamate:4.0.1
    restart: unless-stopped
    depends_on:
      teslamate-db:
        condition: service_started
      mosquitto:
        condition: service_healthy  # wait for broker so the MQTT publisher attaches
    environment:
      - ENCRYPTION_KEY=${TM_ENCRYPTION_KEY}
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TM_DB_PASS}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=teslamate-db
      - MQTT_HOST=mosquitto
      - TZ=Europe/London
    ports:
      - "4000:4000"
    volumes:
      - /mnt/data/teslamate/import:/opt/app/import
    cap_drop:
      - all
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # pinned, manual updates

  teslamate-db:
    container_name: teslamate-db
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      - POSTGRES_USER=teslamate
      - POSTGRES_PASSWORD=${TM_DB_PASS}
      - POSTGRES_DB=teslamate
      - TZ=Europe/London
    volumes:
      - /mnt/data/teslamate/postgres:/var/lib/postgresql
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  teslamate-grafana:
    container_name: teslamate-grafana
    image: teslamate/grafana:4.0.1
    restart: unless-stopped
    depends_on:
      - teslamate-db
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TM_DB_PASS}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=teslamate-db
      # Anonymous LAN access so panels embed cleanly in Home Assistant (no login).
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_BASIC_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_ADMIN_PASSWORD=${TM_GRAFANA_PW}
      - GF_USERS_DEFAULT_THEME=dark
      - TZ=Europe/London
    ports:
      - "3000:3000"
    volumes:
      - /mnt/data/teslamate/grafana:/var/lib/grafana
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # Shared LAN broker: TeslaMate publishes here and HA subscribes. Open for
    # future devices (Zigbee2MQTT etc.) per Marc's choice. Config in the bind mount.
    ports:
      - "1883:1883"
    volumes:
      - /mnt/data/teslamate/mosquitto/config:/mosquitto/config
      - /mnt/data/teslamate/mosquitto/data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true          # Only update containers with opt-in label
      - WATCHTOWER_NOTIFICATIONS_LEVEL=info
      - WATCHTOWER_CLEANUP=true               # Remove old images after update
      - WATCHTOWER_SCHEDULE=0 0 4 * * *       # Check at 4 AM daily
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  portainer_data:
    external: true
  scrypted_scrypted-data:
    external: true
  scrypted_scrypted-cache:
    external: true

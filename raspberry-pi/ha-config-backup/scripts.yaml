open_netflix_on_apple_tv:
  alias: Open Netflix on Apple TV
  sequence:
  - target:
      entity_id: media_player.living_room_apple_tv
    data:
      source: Netflix
    action: media_player.select_source
  mode: single
  description: ''
prepare_the_tesla:
  alias: Prepare Tesla
  mode: single
  description: ''
  sequence:
  - variables:
      car_asleep: '{{ is_state(''binary_sensor.driveway_tesla_model_y_status'', ''off'') }}'
      car_temp: '{{ states(''sensor.driveway_tesla_model_y_outside_temperature'') | float(nan) }}'
      wx_temp: '{{ state_attr(''weather.forecast_home'', ''temperature'') | float(nan) }}'
      t_eff: '{% if not car_asleep and (car_temp == car_temp) %}{{ car_temp }}{% else %}{{ wx_temp }}{% endif %}'
      temp_source: '{% if not car_asleep and (car_temp == car_temp) %}car{% else %}weather{% endif %}'
      t_winter: 5
      t_summer: 23
      target_temp: 21
  - action: button.press
    continue_on_error: true
    target:
      entity_id: button.driveway_tesla_model_y_wake
  - delay:
      seconds: 10
  - action: notify.pushover
    data:
      title: Tesla Prepare
      message: 🚗 Prepare Tesla started. Source={{ temp_source }}, Ambient={{ t_eff | round(1) }}°C.
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (t_eff | float) <= (t_winter | float) }}'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.driveway_tesla_model_y_climate
        data:
          hvac_mode: heat_cool
      - action: climate.set_temperature
        target:
          entity_id: climate.driveway_tesla_model_y_climate
        data:
          temperature: '{{ target_temp }}'
      - action: switch.turn_on
        target:
          entity_id: switch.driveway_tesla_model_y_defrost
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: select.driveway_tesla_model_y_seat_heater_front_left
        data:
          option: high
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: select.driveway_tesla_model_y_seat_heater_front_right
        data:
          option: high
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: select.driveway_tesla_model_y_steering_wheel_heater
        data:
          option: high
      - action: notify.pushover
        data:
          title: Tesla Prepare (Winter)
          message: ❄️ {{ temp_source }}={{ t_eff | round(1) }}°C → heat_cool @ {{ target_temp }}°C + DEFROST; seats High; wheel High.
    - conditions:
      - condition: template
        value_template: '{{ (t_eff | float) >= (t_summer | float) }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.driveway_tesla_model_y_defrost
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.driveway_tesla_model_y_climate
        data:
          hvac_mode: heat_cool
      - action: climate.set_temperature
        target:
          entity_id: climate.driveway_tesla_model_y_climate
        data:
          temperature: '{{ target_temp }}'
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: select.driveway_tesla_model_y_seat_heater_front_left
        data:
          option: 'off'
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: select.driveway_tesla_model_y_seat_heater_front_right
        data:
          option: 'off'
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: select.driveway_tesla_model_y_steering_wheel_heater
        data:
          option: 'off'
      - action: notify.pushover
        data:
          title: Tesla Prepare (Summer)
          message: ☀️ {{ temp_source }}={{ t_eff | round(1) }}°C → heat_cool @ {{ target_temp }}°C; seats & wheel off.
    default:
    - action: switch.turn_off
      target:
        entity_id: switch.driveway_tesla_model_y_defrost
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.driveway_tesla_model_y_climate
      data:
        hvac_mode: heat_cool
    - action: climate.set_temperature
      target:
        entity_id: climate.driveway_tesla_model_y_climate
      data:
        temperature: '{{ target_temp }}'
    - action: select.select_option
      continue_on_error: true
      target:
        entity_id: select.driveway_tesla_model_y_seat_heater_front_left
      data:
        option: 'off'
    - action: select.select_option
      continue_on_error: true
      target:
        entity_id: select.driveway_tesla_model_y_seat_heater_front_right
      data:
        option: 'off'
    - action: select.select_option
      continue_on_error: true
      target:
        entity_id: select.driveway_tesla_model_y_steering_wheel_heater
      data:
        option: 'off'
    - action: notify.pushover
      data:
        title: Tesla Prepare (Mild)
        message: 🌤️ {{ temp_source }}={{ t_eff | round(1) }}°C → heat_cool @ {{ target_temp }}°C; seats off; wheel off.

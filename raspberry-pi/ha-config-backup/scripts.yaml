google_search_query:
  alias: Google Search Query
  description: Ask a question using Google Search grounding via a second Gemini conversation agent. Call this when you need real-time web information.
  fields:
    question:
      description: The question to search for
      required: true
      selector:
        text: null
  sequence:
  - action: conversation.process
    data:
      agent_id: conversation.google_search_agent
      text: '{{ question }}'
    response_variable: search_result
  - stop: ''
    response_variable: search_result
  mode: single
tv_ok_button:
  alias: TV OK Button
  description: Sends OK/Enter IR to LG CX via RM4 Pro. Uses command name lg_cx_ok (learn from physical remote to activate).
  sequence:
  - target:
      entity_id: remote.living_room_broadlink_rm4pro
    data:
      command: lg_cx_ok
      num_repeats: 1
      delay_secs: 0
    action: remote.send_command

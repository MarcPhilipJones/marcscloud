[project]
name = "raspberry-pi"
version = "0.1.0"
description = "Raspberry Pi 5 SSH Client - Connect and manage your Pi remotely"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.4",
  "python-dotenv>=1.0",
  "rich>=13.0",
]

[project.scripts]
raspberry-pi = "raspberry_pi.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "marc-home-assistant"
version = "0.1.0"
description = "Marc Home Assistant - Connect to Home Assistant on Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=12.0",
  "python-dotenv>=1.0",
  "rich>=13.0",
]

[project.scripts]
marc-home-assistant = "marc_home_assistant.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

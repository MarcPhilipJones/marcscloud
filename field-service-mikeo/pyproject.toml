[project]
name = "field-service-mikeo"
version = "0.1.0"
description = "Dataverse client for managing Dynamics 365 Field Service Work Order Types"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "msal>=1.30",
  "python-dotenv>=1.0",
  "rich>=13.0",
]


[project.scripts]
field-service = "field_service_mikeo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
